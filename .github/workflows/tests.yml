name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi pydantic python-jose
      - name: Run focused regressions
        run: pytest tests/test_p3_regressions.py -q
      - name: Audit i18n key usage
        run: python scripts/audit_i18n_usage.py
