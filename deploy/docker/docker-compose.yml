services:
  sases:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/version"]
      interval: 30s
      timeout: 5s
      retries: 3
