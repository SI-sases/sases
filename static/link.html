<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASES Link 节点</title>
<style>
  body{margin:0;background:#0f141b;color:#d9e2ec;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
  header{padding:16px 20px;background:#151d28;border-bottom:1px solid #263243;display:flex;gap:12px;align-items:center}
  h1{font-size:17px;margin:0;flex:1}
  main{max-width:980px;margin:0 auto;padding:18px 20px 60px}
  section{background:#151d28;border:1px solid #263243;border-radius:10px;padding:14px;margin-bottom:16px}
  input,button,select{background:#0f141b;color:#d9e2ec;border:1px solid #33445a;border-radius:6px;padding:7px 9px}
  button{background:#1f6feb;border-color:#1f6feb;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;border-bottom:1px solid #263243;padding:6px 4px;vertical-align:top}
  code{color:#8bd5ff;word-break:break-all}
  .muted{color:#7d8ea3}
  .ok{color:#56d364}.bad{color:#ff7b72}
</style>
</head>
<body>
<header><h1>SASES Link 节点</h1><span id="who" class="muted"></span><button onclick="refresh()">刷新</button></header>
<main>
  <section>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="peer" placeholder="目标节点 ID，例如 node_c2ef..." style="flex:1;min-width:220px">
      <select id="action"><option>status</option><option>start_sases</option><option>restart_sases</option><option>update_client</option><option>wg_install</option></select>
      <button onclick="send()">发送请求</button>
    </div>
    <p class="muted">需要登录 token；普通用户只能看自己的节点。</p>
  </section>
  <section><h2 style="font-size:14px;margin:0 0 8px">节点</h2><table><thead><tr><th>peer_id</th><th>node_id</th><th>base_url</th><th>能力</th><th>状态</th><th>最后在线</th></tr></thead><tbody id="peers"></tbody></table></section>
  <section><h2 style="font-size:14px;margin:0 0 8px">消息 / 结果</h2><table><thead><tr><th>msg_id</th><th>方向</th><th>action</th><th>状态</th><th>结果</th><th>时间</th></tr></thead><tbody id="messages"></tbody></table></section>
</main>
<script>
const token = localStorage.getItem('sases_token') || '';
const headers = token ? {'Authorization':'Bearer '+token} : {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opt={}) {
  const r = await fetch(path, {...opt, headers:{...headers, 'Content-Type':'application/json', ...(opt.headers||{})}});
  if (!r.ok) throw new Error(path+' '+r.status+' '+(await r.text()).slice(0,200));
  return r.json();
}
async function refresh(){
  try{
    const peers = await api('/link/peers');
    document.getElementById('peers').innerHTML = (peers.peers||[]).map(p => `<tr><td>${esc(p.peer_id)}</td><td>${esc(p.node_id)}</td><td>${esc(p.base_url)}</td><td>${esc(p.capabilities)}</td><td class="${p.status==='online'?'ok':'bad'}">${esc(p.status)}</td><td>${esc(p.last_seen)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">暂无节点</td></tr>';
    const msgs = await api('/link/messages?limit=50');
    document.getElementById('messages').innerHTML = (msgs.messages||[]).map(m => `<tr><td><code>${esc(m.msg_id)}</code></td><td>${esc(m.sender)} → ${esc(m.receiver)}</td><td>${esc(m.action)}</td><td>${esc(m.status)}</td><td><code>${esc(m.result||m.error||'')}</code></td><td>${esc(m.updated_at)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">暂无消息</td></tr>';
  }catch(e){ document.getElementById('who').textContent = e.message; }
}
async function send(){
  const to = document.getElementById('peer').value.trim();
  if(!to){ alert('请输入目标节点 ID'); return; }
  try{
    const r = await api('/link/send',{method:'POST',body:JSON.stringify({to,action:document.getElementById('action').value,idempotency_key:'ui-'+Date.now()})});
    document.getElementById('who').textContent = '已发送 '+r.msg_id;
    refresh();
  }catch(e){ alert(e.message); }
}
if(!token) document.getElementById('who').textContent = '未登录：请从 SASES 获取 token';
refresh();
</script>
</body>
</html>
