  <h1>隐私政策</h1>
  <p>SASES 非常重视您的隐私。本政策说明我们如何处理您的数据。</p>
  <h2>1. 数据收集</h2>
  <p>我们仅收集必要信息：用户名、密码哈希、SASES ID、积分余额。API Key 和聊天记录默认存储在本地。</p>
  <h2>2. 数据使用</h2>
  <p>数据用于提供核心服务、排行榜、积分结算。不会出售给第三方。</p>
  <h2>3. 数据存储</h2>
  <p>您的私有数据保存在您的设备上。公开数据（如排行榜）仅包含脱敏信息。</p>
  <h2>4. 用户权利</h2>
  <p>您可以导出、删除自己的数据，或注销账号。</p>
  <h2>5. 联系我们</h2>
  <p>如有隐私问题，请联系我们。</p>
